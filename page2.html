<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Issues - Diet Management</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dffaf1, #ffffff);
        }

        .health-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }

        .language-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-box label {
            font-weight: bold;
        }

        .language-box select {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .health-container h1 {
            color: #159b7d;
            margin-bottom: 15px;
        }

        .description {
            font-size: 16px;
            margin-bottom: 25px;
        }

        .health-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .health-buttons button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #159b7d;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .health-buttons button:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        #healthResult {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #eefaf6;
            color: #333;
            line-height: 1.6;
        }

        #healthResult h2 {
            color: #159b7d;
            margin-top: 0;
        }

        .vitamin-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .vitamin-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
        }

        .vitamin-card img {
            width: 130px;
            height: 110px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .vitamin-card h3 {
            color: #159b7d;
            margin: 5px 0;
        }

        .vitamin-card p {
            margin: 5px 0;
        }

        .note {
            margin-top: 20px;
            padding: 15px;
            background: #ffffff;
            border-radius: 12px;
        }

        .navigation {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .navigation button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn {
            background: #777;
            color: white;
        }

        .done-btn {
            background: #159b7d;
            color: white;
        }

        .navigation button:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .health-container {
                padding: 20px;
                margin: 10px auto;
            }

            .health-buttons {
                grid-template-columns: 1fr;
            }

            .vitamin-list {
                grid-template-columns: 1fr;
            }

            .top-bar {
                justify-content: center;
            }

            .navigation {
                flex-direction: column;
            }

            .navigation button {
                width: 100%;
            }
        }

    </style>

</head>

        // Show selected health issue

        function showHealth(problem) {

            currentProblem = problem;

            const lang =
                document.getElementById("language").value;

            const data =
                healthData[problem];

            let title =
                lang === "te"
                    ? data.titleTe
                    : data.titleEn;


            let recommendedTitle =
                lang === "te"
                    ? "సిఫార్సు చేయబడిన విటమిన్లు"
                    : "Recommended Vitamins";


            let note =
                lang === "te"
                    ? "సమతుల్య ఆహారం ద్వారా అవసరమైన పోషకాలను పొందడం మంచిది. విటమిన్ సప్లిమెంట్లను అవసరమైతే వైద్యుల సలహాతో మాత్రమే ఉపయోగించండి."
                    : "A balanced diet is the best way to get nutrients. Use vitamin supplements only when needed and preferably with professional advice.";


            let html = `

                <h2>${title}</h2>

                <h3>${recommendedTitle}</h3>

                <div class="vitamin-list">
            `;


            data.vitamins.forEach(function(vitamin) {

                let vitaminText =
                    lang === "te"
                        ? vitamin.textTe
                        : vitamin.textEn;


                html += `

                    <div class="vitamin-card">

                        <img
                            src="${vitamin.image}"
                            alt="${vitamin.name}"
                            onerror="this.style.display='none'"
                        >

                        <h3>
                            ${vitamin.name}
                        </h3>

                        <p>
                            ${vitaminText}
                        </p>

                    </div>

                `;

            });


            html += `

                </div>

                <div class="note">

                    <strong>
                        ${lang === "te" ? "గమనిక:" : "Note:"}
                    </strong>

                    <p>
                        ${note}
                    </p>

                </div>

            `;


            document.getElementById("healthResult").innerHTML =
                html;

        }


        // Change language

                document.getElementById("backBtn").innerText =
                    "← వెనుకకు";


                document.getElementById("doneBtn").innerText =
                    "పూర్తయింది ✓";

                        "పైన ఉన్న ఆరోగ్య సమస్యను ఎంచుకోండి.";

                }

                else {

                }

            }


            else {

                    "🌐 Language";


                document.getElementById("pageTitle").innerText =
                    "🩺 Health Issues";

                    "Select your health problem to see the recommended vitamins.";

                    "🦴 Bone Health";

                    "← Back";

                    "Done ✓";

                    document.getElementById("healthResult").innerText =
                        "Select a health issue above.";

                else {

                    showHealth(currentProblem);

        // Back button

                "index.html";

        }


        // Done button
