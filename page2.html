
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Issues - Diet Management App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dffaf1, #ffffff);
    color: #222;
}

.health-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 30px;
    text-align: center;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.top-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.language-box {
    display: flex;
    align-items: center;
    gap: 8px;
}

.language-box label {
    font-weight: bold;
}

.language-box select {
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

h1, #healthResult h2, .vitamin-card h3 {
    color: #159b7d;
}

.description {
    font-size: 16px;
    margin-bottom: 25px;
}

.health-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.health-buttons button {
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #159b7d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.health-buttons button:hover {
    opacity: 0.85;
}

#healthResult {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #eefaf6;
    line-height: 1.6;
}

.vitamin-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.vitamin-card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.vitamin-card img {
    width: 140px;
    height: 120px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
    cursor: zoom-in;
    transition: transform 0.2s;
}

.vitamin-card img:hover {
    transform: scale(1.05);
}

.vitamin-card h3 {
    margin: 5px 0 10px;
}

.note {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 12px;
}

.navigation {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.navigation button {
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.back-btn {
    background: #777;
    color: white;
}

.done-btn {
    background: #159b7d;
    color: white;
}

/* Large photo popup */
.photo-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    padding: 20px;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
}

.photo-modal.show {
    display: flex;
}

.modal-content {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    max-width: 92%;
    max-height: 90%;
    padding: 50px 15px 15px;
    background: white;
    border-radius: 15px;
}

.modal-content img {
    max-width: 100%;
    max-height: 75vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
}

.close-modal {
    position: absolute;
    top: 5px;
    right: 8px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #159b7d;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .health-container {
        padding: 20px;
        margin: 10px auto;
    }

    .health-buttons,
    .vitamin-list {
        grid-template-columns: 1fr;
    }

    .top-bar {
        justify-content: center;
    }

    .navigation {
        flex-direction: column;
    }

    .navigation button {
        width: 100%;
    }

    .modal-content {
        max-width: 96%;
    }

    .modal-content img {
        max-height: 70vh;
    }
}
</style>
</head>

function showHealth(problem) {
    currentProblem = problem;

    const lang = document.getElementById("language").value;
    const data = healthData[problem];

    const title = lang === "te" ? data.titleTe : data.titleEn;
    const recommendedTitle = lang === "te"
        ? "సిఫార్సు చేయబడిన విటమిన్లు"
        : "Recommended Vitamins";

    const note = lang === "te"
        ? "సమతుల్య ఆహారం ద్వారా పోషకాలను పొందండి. విటమిన్ సప్లిమెంట్లను వైద్యుల సలహాతో మాత్రమే ఉపయోగించండి."
        : "A balanced diet is the best way to get nutrients. Use vitamin supplements with professional advice.";

    let html = `
        <h2>${title}</h2>
        <h3>${recommendedTitle}</h3>
        <div class="vitamin-list">
    `;

    data.vitamins.forEach(function(vitamin) {
        const name = lang === "te" ? vitamin.nameTe : vitamin.nameEn;
        const description = lang === "te" ? vitamin.textTe : vitamin.textEn;

        html += `
            <div class="vitamin-card">
                <img src="${vitamin.image}" alt="${name}">
                <h3>${name}</h3>
                <p>${description}</p>
            </div>
        `;
    });

    html += `
        </div>
        <div class="note">
            <strong>${lang === "te" ? "గమనిక:" : "Note:"}</strong>
            <p>${note}</p>
        </div>
    `;

    document.getElementById("healthResult").innerHTML = html;
}

function changeLanguage() {

            weakness: "💪 బలహీనత",
            hair: "💇 జుట్టు రాలడం",
            skin: "🌸 చర్మ సమస్యలు",
            immunity: "🛡️ రోగనిరోధక శక్తి తగ్గడం",
            eye: "👁️ కంటి ఆరోగ్యం",
            bone: "🦴 ఎముకల ఆరోగ్యం",
            back: "← వెనుకకు",
            done: "పూర్తయింది ✓",
            initial: "పైన ఉన్న ఆరోగ్య సమస్యను ఎంచుకోండి."
        }
    };

    const t = translations[lang];

    document.getElementById("languageLabel").innerText = t.language;
    document.getElementById("pageTitle").innerText = t.title;
    document.getElementById("description").innerText = t.description;
    document.getElementById("weaknessBtn").innerText = t.weakness;
    document.getElementById("hairBtn").innerText = t.hair;
    document.getElementById("skinBtn").innerText = t.skin;
    document.getElementById("immunityBtn").innerText = t.immunity;
    document.getElementById("eyeBtn").innerText = t.eye;
    document.getElementById("boneBtn").innerText = t.bone;
    document.getElementById("backBtn").innerText = t.back;
    document.getElementById("doneBtn").innerText = t.done;

    if (currentProblem === "") {
        document.getElementById("healthResult").innerText = t.initial;
    } else {
        showHealth(currentProblem);
    }
}

/* Click vitamin photo to open large */
document.getElementById("healthResult").addEventListener("click", function(event) {
    if (event.target.tagName === "IMG") {
        const modal = document.getElementById("photoModal");
        const largeImage = document.getElementById("largeVitaminPhoto");

        largeImage.src = event.target.src;
        largeImage.alt = event.target.alt;
        modal.classList.add("show");
        document.body.style.overflow = "hidden";
    }
});

function hidePhoto() {
    document.getElementById("photoModal").classList.remove("show");
    document.getElementById("largeVitaminPhoto").src = "";
    document.body.style.overflow = "";
}

function closePhoto(event) {
    if (event.target.id === "photoModal") {
        hidePhoto();
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        hidePhoto();
    }
});

function goBack() {
    window.location.href = "index.html";
}

function doneHealth() {
    window.location.href = "diet.html";
}
