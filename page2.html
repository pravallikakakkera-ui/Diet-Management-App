```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Issues - Diet Management</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .health-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .health-container h1 {
            color: #159b7d;
            margin-bottom: 25px;
        }

        .health-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .health-buttons button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #159b7d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .health-buttons button:hover {
            opacity: 0.85;
        }

        #healthResult {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #eefaf6;
            color: #333;
            line-height: 1.6;
        }

        .navigation {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .navigation button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn {
            background: #777;
            color: white;
        }

        .done-btn {
            background: #159b7d;
            color: white;
        }

        @media (max-width: 600px) {
            .health-buttons {
                grid-template-columns: 1fr;
            }

            .health-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="health-container">

        <h1>🩺 Health Issues</h1>

        <p>
            Select your health problem to see the recommended vitamins.
        </p>

        <div class="health-buttons">

            <button onclick="showHealth('Weakness')">
                💪 Weakness
            </button>

            <button onclick="showHealth('Hair Fall')">
                💇 Hair Fall
            </button>

            <button onclick="showHealth('Skin Problems')">
                🌸 Skin Problems
            </button>

            <button onclick="showHealth('Poor Immunity')">
                🛡️ Poor Immunity
            </button>

            <button onclick="showHealth('Eye Health')">
                👁️ Eye Health
            </button>

            <button onclick="showHealth('Bone Health')">
                🦴 Bone Health
            </button>

        </div>


        <div id="healthResult">
            Select a health issue above.
        </div>


        <div class="navigation">

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back
            </button>

            <button
                class="done-btn"
                onclick="doneHealth()"
            >
                Done ✓
            </button>

        </div>

    </div>


    <script>

        function showHealth(problem) {

            let result =
                document.getElementById("healthResult");


            if (problem === "Weakness") {

                result.innerHTML = `
                    <h3>💪 Weakness</h3>
                    <p>
                        Recommended Vitamins: Vitamin B1, B6, B12 and Vitamin C.
                    </p>
                    <p>
                        These vitamins can support energy production
                        and overall body health.
                    </p>
                `;

            }

            else if (problem === "Hair Fall") {

                result.innerHTML = `
                    <h3>💇 Hair Fall</h3>
                    <p>
                        Recommended Vitamins: Biotin (B7),
                        Vitamin B12, Vitamin D and Vitamin E.
                    </p>
                    <p>
                        A balanced diet containing these nutrients
                        supports healthy hair.
                    </p>
                `;

            }

            else if (problem === "Skin Problems") {

                result.innerHTML = `
                    <h3>🌸 Skin Problems</h3>
                    <p>
                        Recommended Vitamins: Vitamin A,
                        Vitamin C and Vitamin E.
                    </p>
                    <p>
                        Fruits, vegetables and nuts can help provide
                        important nutrients for skin health.
                    </p>
                `;

            }

            else if (problem === "Poor Immunity") {

                result.innerHTML = `
                    <h3>🛡️ Poor Immunity</h3>
                    <p>
                        Recommended Vitamins: Vitamin C,
                        Vitamin D and Vitamin A.
                    </p>
                    <p>
                        Include fruits, vegetables and other
                        nutrient-rich foods in your diet.
                    </p>
                `;

            }

            else if (problem === "Eye Health") {

                result.innerHTML = `
                    <h3>👁️ Eye Health</h3>
                    <p>
                        Recommended Vitamins: Vitamin A,
                        Vitamin C and Vitamin E.
                    </p>
                    <p>
                        Carrots, leafy vegetables and fruits
                        are useful sources of nutrients.
                    </p>
                `;

            }

            else if (problem === "Bone Health") {

                result.innerHTML = `
                    <h3>🦴 Bone Health</h3>
                    <p>
                        Recommended Vitamins: Vitamin D
                        and Vitamin K.
                    </p>
                    <p>
                        Calcium-rich foods and adequate Vitamin D
                        are important for maintaining healthy bones.
                    </p>
                `;

            }

        }


        function goBack() {

            window.location.href = "index.html";

        }


        function doneHealth() {

            window.location.href = "diet.html";

        }

    </script>

</body>

</html>
```
