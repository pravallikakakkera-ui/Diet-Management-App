let currentLanguage = "en";


function renderVitamins() {

    const container = document.getElementById("vitaminContainer");

    container.innerHTML = "";

    vitamins.forEach(vitamin => {

        const card = document.createElement("div");

        card.className = "vitamin-card";

        card.innerHTML = `
            <h2>${vitamin.name[currentLanguage]}</h2>

            <img
                src="${vitamin.image}"
                alt="${vitamin.name[currentLanguage]}"
                class="vitamin-image"
            >

            <div class="section-title">
                ${currentLanguage === "en"
                    ? "Uses / Benefits"
                    : "ఉపయోగాలు / ప్రయోజనాలు"}
            </div>

            <p>${vitamin.uses[currentLanguage]}</p>

            <div class="section-title">
                ${currentLanguage === "en"
                    ? "Food Sources"
                    : "ఆహార వనరులు"}
            </div>

            <p>${vitamin.foods[currentLanguage]}</p>

            <div class="section-title">
                ${currentLanguage === "en"
                    ? "Avoid / Limit"
                    : "తప్పించాలి / పరిమితం చేయాలి"}
            </div>

            <p>${vitamin.avoid[currentLanguage]}</p>
        `;

        container.appendChild(card);
    });
}


function changeLanguage() {

    currentLanguage =
        document.getElementById("languageSelect").value;

    if (currentLanguage === "en") {

        document.getElementById("pageTitle").innerText =
            "💊 All Vitamins";

        document.getElementById("backButton").innerText =
            "⬅️ Back";

        document.getElementById("finishButton").innerText =
            "🏠 Finish";

    } else {

        document.getElementById("pageTitle").innerText =
            "💊 అన్ని విటమిన్లు";

        document.getElementById("backButton").innerText =
            "⬅️ వెనుకకు";

        document.getElementById("finishButton").innerText =
            "🏠 ముగించు";
    }

    renderVitamins();
}


function goBack() {
    window.location.href = "daysplan.html";
}


function finishPage() {
    window.location.href = "index.html";
}


renderVitamins();

</script>

</body>
</html>
