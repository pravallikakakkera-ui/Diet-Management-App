    function displayVitamins(language) {
        const container = document.getElementById("vitaminContainer");
        container.innerHTML = "";

        vitamins.forEach((vitamin, index) => {
            const details = language === "te" ? te[index] : vitamin;

            const card = document.createElement("div");
            card.className = "vitamin-card";

            const heading = document.createElement("h2");
            heading.textContent = details.name;

            const img = document.createElement("img");
            img.src = vitamin.image;
            img.alt = vitamin.name;
            img.title = language === "te"
                ? "పెద్దగా చూడటానికి ఫోటోపై క్లిక్ చేయండి"
                : "Click photo to enlarge";

            // Show a clear message if the filename/path is incorrect.
            img.onerror = function () {
                this.alt = "Photo not found: " + vitamin.image;
                this.style.display = "none";

                const message = document.createElement("p");
                message.style.color = "red";
                message.textContent = "Photo not found: " + vitamin.image;
                card.insertBefore(message, this.nextSibling);
            };

            const use = document.createElement("p");
            const useLabel = document.createElement("strong");
            useLabel.textContent = language === "te"
                ? "ఉపయోగాలు / ప్రయోజనాలు: "
                : "Uses / Benefits: ";
            use.append(useLabel, document.createTextNode(details.use));

            const food = document.createElement("p");
            const foodLabel = document.createElement("strong");
            foodLabel.textContent = language === "te"
                ? "ఆహార వనరులు: "
                : "Food Sources: ";
            food.append(foodLabel, document.createTextNode(details.food));

            const avoid = document.createElement("p");
            const avoidLabel = document.createElement("strong");
            avoidLabel.textContent = language === "te"
                ? "జాగ్రత్త: "
                : "Avoid / Limit: ";
            avoid.append(avoidLabel, document.createTextNode(details.avoid));

            card.append(heading, img, use, food, avoid);
            container.appendChild(card);
        });
    }

    function changeLanguage() {
        const language = document.getElementById("language").value;

        document.getElementById("pageTitle").textContent =
            language === "te" ? "💊 అన్ని విటమిన్లు" : "💊 All Vitamins";

        document.getElementById("backBtn").textContent =

        document.getElementById("finishBtn").textContent =

    // Open the clicked vitamin photo in a large popup.

            largeImage.alt = event.target.alt;

            modal.classList.add("show");
            document.body.style.overflow = "hidden";
        }
    });

    function hidePhoto() {
        document.getElementById("photoModal").classList.remove("show");
        document.getElementById("largeVitaminPhoto").src = "";
        document.body.style.overflow = "";
    }

    function closePhoto(event) {
        if (event.target.id === "photoModal") {
            hidePhoto();
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            hidePhoto();
        }
    });

    }

    function finishPage() {

    }
