function renderVitamins(){

const language =
document.getElementById("languageSelect").value;

const container =
document.getElementById("vitaminsContainer");

container.innerHTML="";


vitamins.forEach(vitamin=>{

const card=document.createElement("div");

card.className="vitamin-card";

card.innerHTML=`

<img src="${vitamin.image}" alt="${vitamin.name[language]}">

<h2>${vitamin.name[language]}</h2>

<h3>
${language==="en"
? "Uses / Benefits"
: "ఉపయోగాలు / ప్రయోజనాలు"}
</h3>

<p>${vitamin.benefits[language]}</p>


<h3>
${language==="en"
? "Food Sources"
: "ఆహార వనరులు"}
</h3>

<p>${vitamin.foods[language]}</p>


<h3>
${language==="en"
? "Avoid / Limit"
: "తప్పించుకోవాలి / పరిమితం చేయాలి"}
</h3>

<p>${vitamin.avoid[language]}</p>

`;

container.appendChild(card);

});

}

document.getElementById("backButton").innerText=
"← వెనుకకు";

document.getElementById("finishButton").innerText=
"ముగించు ✓";

}

else{

document.getElementById("pageTitle").innerText=
"💊 All Vitamins";

document.getElementById("introText").innerText=
"Learn about important vitamins, their benefits, food sources, and things to avoid or limit.";

document.getElementById("backButton").innerText=
"← Back";

document.getElementById("finishButton").innerText=
"Finish ✓";
