function displayVitamins() {
    const te = document.getElementById("language").value === "te";
    const container = document.getElementById("vitaminContainer");
    container.innerHTML = "";

    vitamins.forEach(v => {
        const card = document.createElement("section");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = te ? v.te : v.name;
        card.appendChild(title);

        const photo = document.createElement("img");
        photo.className = "vitamin-photo";
        photo.src = v.image;
        photo.alt = te ? v.te : v.name;
        photo.loading = "lazy";
        photo.onerror = function() {
            this.style.display = "none";
            const msg = document.createElement("p");
            msg.className = "click-note";
            msg.textContent = (te ? "ఫోటో దొరకలేదు: " : "Photo not found: ") + v.image;
            this.parentNode.insertBefore(msg, this.nextSibling);
        };
        photo.onclick = () => openPhoto(v.image, v.name);
        card.appendChild(photo);

        const note = document.createElement("p");
        note.className = "click-note";
        note.textContent = te ? "పెద్దగా చూడటానికి ఫోటోపై క్లిక్ చేయండి" : "Click photo to enlarge";
        card.appendChild(note);

        addDetail(card, te ? "ఉపయోగాలు: " : "Uses: ", te ? v.useTe : v.use);
        addDetail(card, te ? "ఆహార వనరులు: " : "Food sources: ", te ? v.foodTe : v.food);
        addDetail(card, te ? "జాగ్రత్త: " : "Avoid / Limit: ", te ? v.avoidTe : v.avoid);

        container.appendChild(card);
    });
}

function addDetail(card, label, value) {
    const p = document.createElement("p");
    const strong = document.createElement("strong");
    strong.textContent = label;
    p.appendChild(strong);
    p.appendChild(document.createTextNode(value));
    card.appendChild(p);
}

function openPhoto(path, name) {
    const popup = document.getElementById("photoPopup");
    const img = document.getElementById("largePhoto");
    img.src = path;
    img.alt = name;
    popup.style.display = "flex";
}

function closePhoto() {
    document.getElementById("photoPopup").style.display = "none";
    document.getElementById("largePhoto").src = "";
}

function changeLanguage() {
    const te = document.getElementById("language").value === "te";
    document.getElementById("pageTitle").textContent = te ? "💊 అన్ని విటమిన్లు" : "💊 All Vitamins";
    document.getElementById("backBtn").textContent = te ? "← వెనక్కి" : "← Back";
    document.getElementById("finishBtn").textContent = te ? "ముగించు ✓" : "Finish ✓";
    displayVitamins();
}

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePhoto();
});

displayVitamins();
</script>
