    function displayVitamins() {
        const language = document.getElementById("language").value;
        const container = document.getElementById("vitaminContainer");

        container.innerHTML = "";

        vitamins.forEach((vitamin, index) => {
            const name = language === "te" ? vitamin.te : vitamin.name;
            const use = language === "te" ? vitamin.useTe : vitamin.use;
            const food = language === "te" ? vitamin.foodTe : vitamin.food;
            const avoid = language === "te" ? vitamin.avoidTe : vitamin.avoid;

            const card = document.createElement("div");
            card.className = "vitamin-card";

            const heading = document.createElement("h2");
            heading.textContent = name;
            card.appendChild(heading);

            const photo = document.createElement("img");
            photo.className = "vitamin-photo";
            photo.src = vitamin.image;
            photo.alt = name;
            photo.loading = "lazy";
            photo.onclick = function () {
                openPhoto(vitamin.image, name);
            };

            photo.onerror = function () {
                this.alt = "Photo not found: " + vitamin.image;
                this.style.height = "auto";
                this.style.minHeight = "40px";
                this.style.cursor = "default";
                this.onclick = null;
            };

            card.appendChild(photo);

            const note = document.createElement("p");
            note.className = "click-note";
            note.textContent = language === "te"
                ? "పెద్దగా చూడటానికి ఫోటోపై క్లిక్ చేయండి"
                : "Click photo to enlarge";
            card.appendChild(note);

            const useP = document.createElement("p");
            useP.innerHTML = "<strong>" +
                (language === "te" ? "ఉపయోగాలు / ప్రయోజనాలు: " : "Uses / Benefits: ") +
                "</strong>";
            useP.appendChild(document.createTextNode(use));
            card.appendChild(useP);

            const foodP = document.createElement("p");
            foodP.innerHTML = "<strong>" +
                (language === "te" ? "ఆహార వనరులు: " : "Food Sources: ") +
                "</strong>";
            foodP.appendChild(document.createTextNode(food));
            card.appendChild(foodP);

            const avoidP = document.createElement("p");
            avoidP.innerHTML = "<strong>" +
                (language === "te" ? "జాగ్రత్త: " : "Avoid / Limit: ") +
                "</strong>";
            avoidP.appendChild(document.createTextNode(avoid));
            card.appendChild(avoidP);

            container.appendChild(card);
        });
    }

    function openPhoto(imagePath, imageName) {
        const popup = document.getElementById("photoPopup");
        const largePhoto = document.getElementById("largePhoto");

        largePhoto.src = imagePath;
        largePhoto.alt = imageName;
        popup.style.display = "flex";
    }

    function closePhoto() {
        document.getElementById("photoPopup").style.display = "none";
        document.getElementById("largePhoto").src = "";
    }

    function changeLanguage() {

        document.getElementById("backBtn").textContent =
            language === "te" ? "← వెనక్కి" : "← Back";

        document.getElementById("finishBtn").textContent =

    }
