function renderVitamins() {

    const container = document.getElementById("vitaminContainer");

    vitamins.forEach(vitamin => {

        const card = document.createElement("div");

        card.className = "vitamin-card";

        card.innerHTML = `

            <img src="${vitamin.image}"
                 alt="${lang === "en" ? vitamin.nameEn : vitamin.nameTe}"
                 onerror="this.style.display='none';">

            <h2>
                ${lang === "en" ? vitamin.nameEn : vitamin.nameTe}
            </h2>

            <div class="section-title">
                ${lang === "en" ? "Uses / Benefits" : "ఉపయోగాలు / ప్రయోజనాలు"}
            </div>

            <p>
                ${lang === "en" ? vitamin.useEn : vitamin.useTe}
            </p>

            <div class="section-title">
                ${lang === "en" ? "Food Sources" : "ఆహార వనరులు"}
            </div>

            <p>
                ${lang === "en" ? vitamin.foodEn : vitamin.foodTe}
            </p>

            <div class="section-title">
                ${lang === "en" ? "Avoid / Limit" : "నివారించాలి / పరిమితం చేయాలి"}
            </div>

            <p>
                ${lang === "en" ? vitamin.avoidEn : vitamin.avoidTe}
            </p>
        `;

        container.appendChild(card);
    });
}

        document.getElementById("backBtn").innerText =
            "← వెనుకకు";

        document.getElementById("finishBtn").innerText =
            "ముగించు ✓";

    window.location.href = "daysplan.html";
}
