
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diet Management App - Days Plan</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dffaf1,#fff);color:#23433b}
.container{max-width:950px;margin:auto}
h1,h2{text-align:center;color:#11765f}
.card{background:white;padding:20px;margin:18px 0;border-radius:18px;box-shadow:0 4px 14px #00000010}
label{display:block;margin:12px 0 6px;font-weight:bold}
select{width:100%;padding:12px;border:1px solid #b8d9ce;border-radius:9px;font-size:16px;background:white}
button{border:0;background:#159b7d;color:white;padding:12px 17px;border-radius:10px;cursor:pointer;font-size:15px;margin:5px}
button:hover{background:#0d765e}
button.selected{background:#075b49;outline:3px solid #a7e6d5}
.button-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.result{background:#effbf6;padding:15px;border-radius:12px;margin-top:12px;line-height:1.8}
.navigation{display:flex;justify-content:space-between;gap:10px;margin:25px 0}
.hidden{display:none}
@media(max-width:500px){body{padding:10px}.card{padding:14px}}
</style>
</head>
<body>
<div class="container">

<h1 id="title">📅 Your Days Diet Plan</h1>

<div class="card">
<label id="languageLabel" for="language">🌐 Select Language</label>
<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="te">తెలుగు</option>
</select>
</div>

<div class="card">
<h2 id="goalTitle">🎯 Select Goal</h2>
<div class="button-row">
<button id="loss" onclick="choose('goal','loss',this)">Weight Loss</button>
<button id="gain" onclick="choose('goal','gain',this)">Weight Gain</button>
<button id="healthy" onclick="choose('goal','healthy',this)">Healthy Diet</button>
</div>
</div>

<div class="card">
<h2 id="daysTitle">📆 Select Days</h2>
<div class="button-row">
<button id="d7" onclick="choose('days','7',this)">7 Days</button>
<button id="d15" onclick="choose('days','15',this)">15 Days</button>
<button id="d30" onclick="choose('days','30',this)">30 Days</button>
</div>
</div>

<div class="card">
<h2 id="foodTitle">🍽️ Select Food</h2>
<div class="button-row">
<button id="veg" onclick="choose('food','veg',this)">🥦 Vegetarian</button>
<button id="nonveg" onclick="choose('food','nonveg',this)">🍗 Non-Vegetarian</button>
</div>
</div>

<div class="card">
<h2 id="calorieTitle">🔥 Select Daily Calories</h2>
<label id="calorieLabel" for="calories">Daily calorie target</label>
<select id="calories">
<option value="1500">1500 calories</option>
<option value="1800">1800 calories</option>
<option value="2000">2000 calories</option>
<option value="2200">2200 calories</option>
<option value="2500">2500 calories</option>
</select>
<p id="calorieNote">Calorie needs vary by age, body size, activity and health.</p>
</div>

<div class="card">
<div class="button-row">
<button id="generate" onclick="generatePlan()">🍽️ Generate Days Plan</button>
</div>
<div id="plan" class="hidden"></div>
</div>

<div class="navigation">
<button id="back" onclick="location.href='diet.html'">← Back</button>
<button id="next" onclick="location.href='vitamins-page.html'">Next →</button>
</div>

</div>

function tr(key){return text[lang][key]||key}

function changeLanguage(){
lang=document.getElementById("language").value;
document.documentElement.lang=lang==="te"?"te":"en";
Object.keys(text[lang]).forEach(key=>{
const el=document.getElementById(key);
if(el) el.textContent=text[lang][key];
});
if(!document.getElementById("plan").classList.contains("hidden")) generatePlan();
}

function choose(type,value,button){
if(type==="goal")goal=value;
if(type==="days")days=value;
if(type==="food")food=value;
const group={goal:["loss","gain","healthy"],days:["d7","d15","d30"],food:["veg","nonveg"]}[type];
group.forEach(id=>document.getElementById(id).classList.remove("selected"));
button.classList.add("selected");
}

function generatePlan(){
if(!goal){alert(tr("chooseGoal"));return}
if(!days){alert(tr("chooseDays"));return}
if(!food){alert(tr("chooseFood"));return}

const calorie=document.getElementById("calories").value;
const plan=document.getElementById("plan");
plan.innerHTML="";

const menu=lang==="te"
?(food==="veg"?meals.teVeg:meals.teNonveg)
:(food==="veg"?meals.veg:meals.nonveg);

const goalName={
en:{loss:"Weight Loss",gain:"Weight Gain",healthy:"Healthy Diet"},
te:{loss:"బరువు తగ్గడం",gain:"బరువు పెరగడం",healthy:"ఆరోగ్యకరమైన ఆహారం"}
};
const goalLine=document.createElement("div");
goalLine.className="result";
goalLine.textContent=goalName[lang][goal]+" • "+calorie+" "+(lang==="te"?"క్యాలరీలు":"calories");
plan.appendChild(goalLine);

for(let i=0;i<Number(days);i++){
const card=document.createElement("div");
card.className="result";
const heading=document.createElement("h2");
heading.textContent=tr("day")+" "+(i+1);
card.appendChild(heading);

[0,1,2,3].forEach((mealIndex)=>{
const p=document.createElement("p");
const strong=document.createElement("strong");
strong.textContent=tr(["breakfast","lunch","snacks","dinner"][mealIndex])+": ";
p.appendChild(strong);
p.appendChild(document.createTextNode(menu[i%7][mealIndex]));
card.appendChild(p);
});
plan.appendChild(card);
}
const note=document.createElement("p");
note.textContent=tr("note");
plan.appendChild(note);
plan.classList.remove("hidden");
plan.scrollIntoView({behavior:"smooth",block:"start"});
}
