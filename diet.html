<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diet Management App - Diet Plan</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dffaf1, #ffffff);
    color: #23433b;
}

.container {
    max-width: 950px;
    margin: auto;
}

h1, h2, h3 {
    text-align: center;
    color: #11765f;
}

.card {
    background: white;
    padding: 20px;
    margin: 18px 0;
    border-radius: 18px;
    box-shadow: 0 4px 14px #00000010;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #b8d9ce;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

button {
    border: none;
    background: #159b7d;
    color: white;
    padding: 12px 17px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    margin: 5px;
}

button:hover {
    background: #0d765e;
}

button.selected {
    background: #075b49;
    outline: 3px solid #a7e6d5;
}

.button-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
}

.food-option {
    padding: 12px;
    background: #effbf6;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.food-option input {
    width: auto;
}

.result {
    background: #effbf6;
    padding: 15px;
    border-radius: 12px;
    margin-top: 12px;
    line-height: 1.8;
}

.hidden {
    display: none !important;
}

.vitamin-card {
    text-align: center;
    padding: 12px;
    border: 1px solid #d5eee5;
    border-radius: 14px;
    background: #f9fffc;
}

.vitamin-card img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    cursor: zoom-in;
    border-radius: 10px;
}

.vitamin-card img:hover {
    transform: scale(1.04);
}

.vitamin-card h3 {
    margin: 8px 0;
}

.vitamin-card p {
    font-size: 14px;
    line-height: 1.5;
}

#photoPopup {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000000d9;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

#photoPopup.show {
    display: flex;
}

.popup-content {
    background: white;
    border-radius: 16px;
    padding: 15px;
    max-width: 600px;
    width: 100%;
    text-align: center;
}

#largePhoto {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
}

.close-button {
    background: #d94343;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 25px 0;
}

.navigation button {
    min-width: 110px;
}

@media (max-width: 500px) {
    body {
        padding: 10px;
    }

    .card {
        padding: 14px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1 id="pageTitle">🥗 Personalized Diet Plan</h1>

    <div class="card">
        <label id="languageLabel" for="language">🌐 Select Language</label>
        <select id="language" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="te">తెలుగు</option>
        </select>
    </div>

    <div class="card">
        <h2 id="personalTitle">👤 Personal Details</h2>

        <label id="ageLabel" for="age">Age</label>
        <input id="age" type="number" min="1" max="120" placeholder="Enter your age">

        <label id="genderLabel" for="gender">Gender</label>
        <select id="gender">
            <option value="">Select Gender</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
        </select>

        <label id="heightLabel" for="height">Height (cm)</label>
        <input id="height" type="number" min="50" max="250" placeholder="Example: 160">

        <label id="weightLabel" for="weight">Weight (kg)</label>
        <input id="weight" type="number" min="10" max="350" placeholder="Example: 60">

        <div class="button-row">
            <button id="bmiButton" onclick="calculateBMI()">Calculate BMI</button>
        </div>

        <div id="bmiResult" class="result hidden"></div>
    </div>

    <div class="card">
        <h2 id="goalTitle">🎯 What is your goal?</h2>
        <div class="button-row">
            <button id="lossBtn" onclick="selectGoal('loss', this)">⚖️ Weight Loss</button>
            <button id="gainBtn" onclick="selectGoal('gain', this)">💪 Weight Gain</button>
            <button id="healthyBtn" onclick="selectGoal('healthy', this)">🥗 Healthy Diet</button>
        </div>
        <div id="goalResult" class="result hidden"></div>
    </div>

    <div class="card">
        <h2 id="foodTypeTitle">🍽️ Select Food Type</h2>
        <div class="button-row">
            <button id="vegBtn" onclick="selectFoodType('veg', this)">🥦 Veg</button>
            <button id="nonVegBtn" onclick="selectFoodType('nonveg', this)">🍗 Non-Veg</button>
        </div>
    </div>

    <div class="card">
        <h2 id="foodChoiceTitle">❤️ Choose Your Favourite Foods</h2>
        <p id="foodChoiceText">Select the foods you like. Your diet plan will use these foods.</p>
        <div id="foodGrid" class="grid"></div>

        <div class="button-row">
            <button id="generateButton" onclick="generateDiet()">🍽️ Generate My Diet Plan</button>
        </div>
    </div>

    <div id="dietResult" class="hidden">
        <div class="card">
            <h2 id="dailyTitle">🍴 Your Daily Diet Plan</h2>
            <div id="dailyPlan"></div>
        </div>

        <div class="card">
            <h2 id="vitaminTitle">💊 Recommended Vitamins</h2>
            <p id="vitaminHint">Click a vitamin photo to view it larger.</p>
            <div id="vitaminGrid" class="grid"></div>
        </div>
    </div>

    <div class="navigation">
        <button id="backButton" onclick="goBack()">← Back</button>
        <button id="nextButton" onclick="goNext()">Next →</button>
    </div>

</div>

<div id="photoPopup" onclick="closePhoto()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <h2 id="popupTitle">Vitamin Photo</h2>
        <img id="largePhoto" src="" alt="Vitamin photo">
        <br>
        <button id="closeButton" class="close-button" onclick="closePhoto()">Close ✖</button>
    </div>
</div>

        selectedFoods: "మీరు ఎంచుకున్న ఆహారాలు",
        note: "ఇది సాధారణ నమూనా డైట్ ప్లాన్ మాత్రమే. మీ అవసరాలకు అనుగుణంగా ఆహార పరిమాణాలను మార్చుకోండి. ఆరోగ్య సమస్యలు ఉంటే నిపుణుల సలహా తీసుకోండి.",
        photoUnavailable: "ఫోటో అందుబాటులో లేదు",
        noVitaminPhoto: "ఫోటో అందుబాటులో లేదు"
    }
};

function t(key) {
    return translations[currentLanguage][key] || key;
}

function changeLanguage() {
    currentLanguage = document.getElementById("language").value;
    document.documentElement.lang = currentLanguage === "te" ? "te" : "en";

    const keys = [
        "pageTitle", "languageLabel", "personalTitle", "ageLabel",
        "genderLabel", "heightLabel", "weightLabel", "bmiButton",
        "goalTitle", "lossBtn", "gainBtn", "healthyBtn",
        "foodTypeTitle", "vegBtn", "nonVegBtn", "foodChoiceTitle",
        "foodChoiceText", "generateButton", "dailyTitle", "vitaminTitle",
        "vitaminHint", "backButton", "nextButton", "closeButton"
    ];

    keys.forEach(function(key) {
        const element = document.getElementById(key);
        if (element) element.textContent = t(key);
    });

    document.getElementById("age").placeholder = t("agePlaceholder");
    document.getElementById("height").placeholder = t("heightPlaceholder");
    document.getElementById("weight").placeholder = t("weightPlaceholder");

    const gender = document.getElementById("gender");
    gender.options[0].text = t("selectGender");
    gender.options[1].text = t("female");
    gender.options[2].text = t("male");

    renderFoods();

    if (lastBMI !== null) {
        calculateBMI();
    }

    updateGoalResult();

    if (!document.getElementById("dietResult").classList.contains("hidden")) {
        generateDiet();
    }
}

function selectGoal(goal, button) {
    currentGoal = goal;

    ["lossBtn", "gainBtn", "healthyBtn"].forEach(function(id) {
        document.getElementById(id).classList.remove("selected");
    });

    button.classList.add("selected");
    updateGoalResult();
}

function updateGoalResult() {
    const result = document.getElementById("goalResult");

    if (!currentGoal) {
        result.classList.add("hidden");
        return;
    }

    const messageKey = currentGoal === "loss"
        ? "goalLoss"
        : currentGoal === "gain"
            ? "goalGain"
            : "goalHealthy";

    result.textContent = t(messageKey);
    result.classList.remove("hidden");
}

function calculateBMI() {
    const height = Number(document.getElementById("height").value);
    const weight = Number(document.getElementById("weight").value);
    const result = document.getElementById("bmiResult");

    if (!height || !weight || height <= 0 || weight <= 0) {
        result.textContent = t("bmiInvalid");
        result.classList.remove("hidden");
        lastBMI = null;
        return;
    }

    lastBMI = weight / ((height / 100) ** 2);

    let category;
    if (lastBMI < 18.5) {
        category = t("bmiUnder");
    } else if (lastBMI < 25) {
        category = t("bmiNormal");
    } else if (lastBMI < 30) {
        category = t("bmiOver");
    } else {
        category = t("bmiObese");
    }

    result.textContent = t("bmiLabel") + ": " + lastBMI.toFixed(1) + " — " + category;
    result.classList.remove("hidden");
}

function selectFoodType(type, button) {
    currentFoodType = type;

    document.getElementById("vegBtn").classList.remove("selected");
    document.getElementById("nonVegBtn").classList.remove("selected");
    button.classList.add("selected");

    renderFoods();
}

function renderFoods() {
    const grid = document.getElementById("foodGrid");
    const previouslySelected = [...grid.querySelectorAll("input:checked")]
        .map(input => input.value);

    grid.innerHTML = "";

    if (!currentFoodType) return;

    foods[currentFoodType].forEach(function(food) {
        const label = document.createElement("label");
        label.className = "food-option";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = food.name;
        checkbox.checked = previouslySelected.includes(food.name);

        const name = document.createElement("span");
        name.textContent = currentLanguage === "te" ? food.te : food.name;

        label.appendChild(checkbox);
        label.appendChild(name);
        grid.appendChild(label);
    });
}

function generateDiet() {
    if (!currentGoal) {
        alert(t("chooseGoal"));
        return;
    }

    if (!currentFoodType) {
        alert(t("chooseFoodType"));
        return;
    }

    const selected = [...document.querySelectorAll("#foodGrid input:checked")]
        .map(input => input.value);

    if (selected.length === 0) {
        alert(t("chooseFoods"));
        return;
    }

    const selectedFoods = foods[currentFoodType].filter(food =>
        selected.includes(food.name)
    );

    const foodNames = selectedFoods.map(food =>
        currentLanguage === "te" ? food.te : food.name
    );

    const breakfastFoods = foodNames.slice(0, 3);
    const lunchFoods = foodNames.slice(3, 6);
    const snackFoods = foodNames.slice(6, 9);
    const dinnerFoods = foodNames.slice(9, 12);

    const plan = document.getElementById("dailyPlan");
    plan.innerHTML = "";

    const meals = [
        { title: t("breakfast"), items: breakfastFoods },
        { title: t("lunch"), items: lunchFoods },
        { title: t("snacks"), items: snackFoods },
        { title: t("dinner"), items: dinnerFoods }
    ];

    meals.forEach(function(meal) {
        const section = document.createElement("div");
        section.className = "result";

        const heading = document.createElement("strong");
        heading.textContent = meal.title;

        const details = document.createElement("p");
        details.textContent = meal.items.length
            ? meal.items.join(", ")
            : foodNames[0];

        section.appendChild(heading);
        section.appendChild(details);
        plan.appendChild(section);
    });

    const note = document.createElement("p");
    note.textContent = t("note");
    plan.appendChild(note);

    const vitaminCodes = [...new Set(selectedFoods.flatMap(food => food.vitamins))];
    renderVitamins(vitaminCodes);

    document.getElementById("dietResult").classList.remove("hidden");
    document.getElementById("dietResult").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function renderVitamins(codes) {
    const grid = document.getElementById("vitaminGrid");
    grid.innerHTML = "";

    codes.forEach(function(code) {
        const vitamin = vitamins[code];
        if (!vitamin) return;

        const card = document.createElement("div");
        card.className = "vitamin-card";

        const image = document.createElement("img");
        image.src = vitamin.image;
        image.alt = currentLanguage === "te" ? vitamin.te : vitamin.en;
        image.loading = "lazy";
        image.onclick = function() {
            openPhoto(vitamin.image, currentLanguage === "te" ? vitamin.te : vitamin.en);
        };

        image.onerror = function() {
            this.style.display = "none";
            const unavailable = document.createElement("p");
            unavailable.textContent = t("noVitaminPhoto");
            card.insertBefore(unavailable, card.children[1] || null);
        };

        const title = document.createElement("h3");
        title.textContent = currentLanguage === "te" ? vitamin.te : vitamin.en;

        const use = document.createElement("p");
        use.textContent = currentLanguage === "te" ? vitamin.useTe : vitamin.useEn;

        card.appendChild(image);
        card.appendChild(title);
        card.appendChild(use);
        grid.appendChild(card);
    });
}

function openPhoto(path, name) {
    const popup = document.getElementById("photoPopup");
    const image = document.getElementById("largePhoto");

    document.getElementById("popupTitle").textContent = name;
    image.src = path;
    image.alt = name;

    image.onerror = function() {
        this.alt = t("noVitaminPhoto");
    };

    popup.classList.add("show");
}

function closePhoto() {
    document.getElementById("photoPopup").classList.remove("show");
}

function goBack() {
    window.location.href = "page2.html";
}

function goNext() {
    window.location.href = "days-plan.html";
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") closePhoto();
});
</script>
</body>
</html>
