<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Days Diet Plan</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dffaf1,#ffffff);
    color:#222;
}

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.language{
    text-align:right;
    margin-bottom:15px;
}

select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

h1{
    text-align:center;
    color:#159b7d;
    margin-bottom:30px;
}

h2{
    color:#159b7d;
    margin-top:10px;
}

.section{
    background:#f3fffb;
    padding:20px;
    border-radius:18px;
    margin-top:20px;
}

.option-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:15px;
}

.option-btn{
    padding:13px 25px;
    border:none;
    border-radius:28px;
    background:#159b7d;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.option-btn.selected{
    background:#075c49;
    box-shadow:0 0 0 3px #b6eee0;
}

.generate-btn{
    display:block;
    margin:30px auto;
    padding:15px 32px;
    border:none;
    border-radius:30px;
    background:#10745f;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#planResult{
    margin-top:25px;
}

.day-card{
    background:#f8fffc;
    border:1px solid #d5eee6;
    border-radius:18px;
    padding:20px;
    margin-top:20px;
}

.day-title{
    color:#159b7d;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.meal-card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin:10px 0;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.meal-name{
    font-weight:bold;
    color:#10745f;
    font-size:17px;
}

.navigation{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:35px;
}

.back-btn,
.next-btn{
    padding:15px 40px;
    border:none;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.back-btn{
    background:#777;
    color:white;
}

.next-btn{
    background:#159b7d;
    color:white;
}

@media(max-width:600px){

    .navigation{
        flex-direction:column;
    }

    .back-btn,
    .next-btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="language">

🌐

<select id="language" onchange="changeLanguage()">

<option value="en">English</option>

<option value="te">తెలుగు</option>

</select>

</div>

<h1 id="title">
📅 Days Diet Plan
</h1>

<!-- GOAL -->

<div class="section">

<h2 id="goalTitle">
🎯 Select Your Goal
</h2>

<div class="option-buttons">

<button class="option-btn"
onclick="selectGoal('loss',this)"
id="lossBtn">

⚖️ Weight Loss

</button>

<button class="option-btn"
onclick="selectGoal('gain',this)"
id="gainBtn">

💪 Weight Gain

</button>

<button class="option-btn"
onclick="selectGoal('healthy',this)"
id="healthyBtn">

🥗 Healthy Diet

</button>

</div>

</div>

<!-- DAYS -->

<div class="section">

<h2 id="daysTitle">
📆 Select Number of Days
</h2>

<div class="option-buttons">

<button class="option-btn dayBtn"
onclick="selectDays(1,this)"
id="day1Btn">

1 Day

</button>

<button class="option-btn dayBtn"
onclick="selectDays(7,this)"
id="day7Btn">

7 Days

</button>

<button class="option-btn dayBtn"
onclick="selectDays(15,this)"
id="day15Btn">

15 Days

</button>

<button class="option-btn dayBtn"
onclick="selectDays(30,this)"
id="day30Btn">

30 Days

</button>

</div>

</div>

<!-- FOOD TYPE -->

<div class="section">

<h2 id="foodTitle">
🍽️ Select Food Type
</h2>

<div class="option-buttons">

<button class="option-btn"
onclick="selectFood('veg',this)"
id="vegBtn">

🥦 Veg

</button>

<button class="option-btn"
onclick="selectFood('nonveg',this)"
id="nonVegBtn">

🍗 Non-Veg

</button>

</div>

</div>

<!-- CALORIES -->

<div class="section">

<h2 id="calorieTitle">
🔥 Select Daily Calories
</h2>

<div class="option-buttons">

<button class="option-btn"
onclick="selectCalories(1500,this)">

1500 kcal

</button>

<button class="option-btn"
onclick="selectCalories(1800,this)">

1800 kcal

</button>

<button class="option-btn"
onclick="selectCalories(2000,this)">

2000 kcal

</button>

<button class="option-btn"
onclick="selectCalories(2200,this)">

2200 kcal

</button>

<button class="option-btn"
onclick="selectCalories(2500,this)">

2500 kcal

</button>

</div>

</div>

<button class="generate-btn"
onclick="generatePlan()"
id="generateButton">

🍽️ Generate Diet Plan

</button>

<div id="planResult"></div>

<!-- NAVIGATION -->

<div class="navigation">

<button class="back-btn"
onclick="goBack()"
id="backButton">

← Back

</button>

<button class="next-btn"
onclick="goNext()"
id="nextButton">

Next →

</button>

</div>

</div>

<script>

let selectedGoal="";
let selectedDays=0;
let selectedFood="";
let selectedCalories=0;


/* GET LANGUAGE */

function getLanguage(){

    return document.getElementById("language").value;

}


/* GOAL */

function selectGoal(goal,button){

    selectedGoal=goal;

    document.querySelectorAll("#lossBtn,#gainBtn,#healthyBtn")
    .forEach(btn=>{
        btn.classList.remove("selected");
    });

    button.classList.add("selected");

}


/* DAYS */

function selectDays(days,button){

    selectedDays=days;

    document.querySelectorAll(".dayBtn")
    .forEach(btn=>{
        btn.classList.remove("selected");
    });

    button.classList.add("selected");

}


/* FOOD */

function selectFood(food,button){

    selectedFood=food;

    document.querySelectorAll("#vegBtn,#nonVegBtn")
    .forEach(btn=>{
        btn.classList.remove("selected");
    });

    button.classList.add("selected");

}


/* CALORIES */

function selectCalories(calories,button){

    selectedCalories=calories;

    button.parentElement
    .querySelectorAll(".option-btn")
    .forEach(btn=>{
        btn.classList.remove("selected");
    });

    button.classList.add("selected");

}


/* GENERATE PLAN */

function generatePlan(){

    const lang=getLanguage();


    if(!selectedGoal){

        alert(
            lang==="te"
            ? "దయచేసి మీ లక్ష్యాన్ని ఎంచుకోండి."
            : "Please select your goal."
        );

        return;
    }


    if(!selectedDays){

        alert(
            lang==="te"
            ? "దయచేసి ఎన్ని రోజులు కావాలో ఎంచుకోండి."
            : "Please select number of days."
        );

        return;
    }


    if(!selectedFood){

        alert(
            lang==="te"
            ? "దయచేసి వెజ్ లేదా నాన్-వెజ్ ఎంచుకోండి."
            : "Please select Veg or Non-Veg."
        );

        return;
    }


    if(!selectedCalories){

        alert(
            lang==="te"
            ? "దయచేసి రోజువారీ క్యాలరీలను ఎంచుకోండి."
            : "Please select daily calories."
        );

        return;
    }


    const result=document.getElementById("planResult");

    result.innerHTML="";


    /* GOAL TEXT */

    let goalText="";

    if(lang==="te"){

        if(selectedGoal==="loss"){
            goalText="బరువు తగ్గడం";
        }

        else if(selectedGoal==="gain"){
            goalText="బరువు పెరగడం";
        }

        else{
            goalText="ఆరోగ్యకరమైన ఆహారం";
        }

    }

    else{

        if(selectedGoal==="loss"){
            goalText="Weight Loss";
        }

        else if(selectedGoal==="gain"){
            goalText="Weight Gain";
        }

        else{
            goalText="Healthy Diet";
        }

    }


    /* FOOD TEXT */

    let foodText="";

    if(lang==="te"){

        foodText=
        selectedFood==="veg"
        ? "వెజ్"
        : "నాన్-వెజ్";

    }

    else{

        foodText=
        selectedFood==="veg"
        ? "Vegetarian"
        : "Non-Vegetarian";

    }


    /* SUMMARY */

    const summary=document.createElement("div");

    summary.className="section";


    if(lang==="te"){

        summary.innerHTML=`

        <h2>✅ మీరు ఎంచుకున్న ప్లాన్</h2>

        <p>
        <strong>లక్ష్యం:</strong>
        ${goalText}
        </p>

        <p>
        <strong>ఆహార రకం:</strong>
        ${foodText}
        </p>

        <p>
        <strong>వ్యవధి:</strong>
        ${selectedDays} రోజులు
        </p>

        <p>
        <strong>రోజువారీ క్యాలరీలు:</strong>
        ${selectedCalories} kcal
        </p>

        `;

    }

    else{

        summary.innerHTML=`

        <h2>✅ Your Selected Plan</h2>

        <p>
        <strong>Goal:</strong>
        ${goalText}
        </p>

        <p>
        <strong>Food Type:</strong>
        ${foodText}
        </p>

        <p>
        <strong>Duration:</strong>
        ${selectedDays} Day(s)
        </p>

        <p>
        <strong>Daily Calories:</strong>
        ${selectedCalories} kcal
        </p>

        `;

    }


    result.appendChild(summary);


    /* FOOD LIST - ENGLISH */

    const breakfastVegEn=[
        "Idli with Sambar",
        "Vegetable Upma",
        "Poha with Vegetables",
        "Dosa with Chutney"
    ];

    const lunchVegEn=[
        "Rice with Dal and Vegetables",
        "Roti with Dal",
        "Rice with Leafy Vegetables",
        "Vegetable Curry with Roti"
    ];

    const snackVegEn=[
        "Fruit",
        "Nuts",
        "Milk",
        "Curd with Fruit"
    ];

    const dinnerVegEn=[
        "Roti with Vegetables",
        "Vegetable Soup",
        "Rice with Dal",
        "Curd Rice with Vegetables"
    ];


    const breakfastNonVegEn=[
        "Boiled Eggs with Idli",
        "Egg Omelette with Dosa",
        "Vegetable Upma with Egg",
        "Eggs with Toast"
    ];

    const lunchNonVegEn=[
        "Rice with Chicken",
        "Rice with Fish and Vegetables",
        "Roti with Chicken",
        "Rice with Egg Curry"
    ];

    const snackNonVegEn=[
        "Fruit",
        "Nuts",
        "Milk",
        "Boiled Egg"
    ];

    const dinnerNonVegEn=[
        "Roti with Chicken",
        "Rice with Fish",
        "Egg Curry with Roti",
        "Chicken Soup"
    ];


    /* FOOD LIST - TELUGU */

    const breakfastVegTe=[
        "సాంబార్‌తో ఇడ్లీ",
        "కూరగాయల ఉప్మా",
        "కూరగాయలతో అటుకుల ఉప్మా",
        "చట్నీతో దోస"
    ];

    const lunchVegTe=[
        "పప్పు మరియు కూరగాయలతో అన్నం",
        "పప్పుతో రోటీ",
        "ఆకుకూరలతో అన్నం",
        "కూరగాయల కూరతో రోటీ"
    ];

    const snackVegTe=[
        "పండు",
        "నట్స్",
        "పాలు",
        "పండుతో పెరుగు"
    ];

    const dinnerVegTe=[
        "కూరగాయలతో రోటీ",
        "కూరగాయల సూప్",
        "పప్పుతో అన్నం",
        "కూరగాయలతో పెరుగు అన్నం"
    ];


    const breakfastNonVegTe=[
        "ఇడ్లీతో ఉడికించిన గుడ్లు",
        "దోసతో ఎగ్ ఆమ్లెట్",
        "గుడ్డుతో కూరగాయల ఉప్మా",
        "టోస్ట్‌తో గుడ్లు"
    ];

    const lunchNonVegTe=[
        "చికెన్‌తో అన్నం",
        "చేపలు మరియు కూరగాయలతో అన్నం",
        "చికెన్‌తో రోటీ",
        "ఎగ్ కర్రీతో అన్నం"
    ];

    const snackNonVegTe=[
        "పండు",
        "నట్స్",
        "పాలు",
        "ఉడికించిన గుడ్డు"
    ];

    const dinnerNonVegTe=[
        "చికెన్‌తో రోటీ",
        "చేపలతో అన్నం",
        "ఎగ్ కర్రీతో రోటీ",
        "చికెన్ సూప్"
    ];


    /* SELECT LIST */

    let breakfastVeg;
    let lunchVeg;
    let snackVeg;
    let dinnerVeg;

    let breakfastNonVeg;
    let lunchNonVeg;
    let snackNonVeg;
    let dinnerNonVeg;


    if(lang==="te"){

        breakfastVeg=breakfastVegTe;
        lunchVeg=lunchVegTe;
        snackVeg=snackVegTe;
        dinnerVeg=dinnerVegTe;

        breakfastNonVeg=breakfastNonVegTe;
        lunchNonVeg=lunchNonVegTe;
        snackNonVeg=snackNonVegTe;
        dinnerNonVeg=dinnerNonVegTe;

    }

    else{

        breakfastVeg=breakfastVegEn;
        lunchVeg=lunchVegEn;
        snackVeg=snackVegEn;
        dinnerVeg=dinnerVegEn;

        breakfastNonVeg=breakfastNonVegEn;
        lunchNonVeg=lunchNonVegEn;
        snackNonVeg=snackNonVegEn;
        dinnerNonVeg=dinnerNonVegEn;

    }


    /* CREATE DAYS */

    for(let day=1;day<=selectedDays;day++){

        let breakfast;
        let lunch;
        let snack;
        let dinner;


        if(selectedFood==="veg"){

            breakfast=
            breakfastVeg[(day-1)%breakfastVeg.length];

            lunch=
            lunchVeg[(day-1)%lunchVeg.length];

            snack=
            snackVeg[(day-1)%snackVeg.length];

            dinner=
            dinnerVeg[(day-1)%dinnerVeg.length];

        }

        else{

            breakfast=
            breakfastNonVeg[(day-1)%breakfastNonVeg.length];

            lunch=
            lunchNonVeg[(day-1)%lunchNonVeg.length];

            snack=
            snackNonVeg[(day-1)%snackNonVeg.length];

            dinner=
            dinnerNonVeg[(day-1)%dinnerNonVeg.length];

        }


        const dayCard=document.createElement("div");

        dayCard.className="day-card";


        if(lang==="te"){

            dayCard.innerHTML=`

            <div class="day-title">
            📅 ${day}వ రోజు
            </div>

            <div class="meal-card">

            <div class="meal-name">
            🌅 ఉదయం అల్పాహారం
            </div>

            <p>${breakfast}</p>

            </div>


            <div class="meal-card">

            <div class="meal-name">
            ☀️ మధ్యాహ్న భోజనం
            </div>

            <p>${lunch}</p>

            </div>


            <div class="meal-card">

            <div class="meal-name">
            🍎 సాయంత్రం స్నాక్
            </div>

            <p>${snack}</p>

            </div>


            <div class="meal-card">

            <div class="meal-name">
            🌙 రాత్రి భోజనం
            </div>

            <p>${dinner}</p>

            </div>

            `;

        }

        else{

            dayCard.innerHTML=`

            <div class="day-title">
            📅 Day ${day}
            </div>

            <div class="meal-card">

            <div class="meal-name">
            🌅 Breakfast
            </div>

            <p>${breakfast}</p>

            </div>


            <div class="meal-card">

            <div class="meal-name">
            ☀️ Lunch
            </div>

            <p>${lunch}</p>

            </div>


            <div class="meal-card">

            <div class="meal-name">
            🍎 Evening Snack
            </div>

            <p>${snack}</p>

            </div>


            <div class="meal-card">

            <div class="meal-name">
            🌙 Dinner
            </div>

            <p>${dinner}</p>

            </div>

            `;

        }


        result.appendChild(dayCard);

    }


    result.scrollIntoView({
        behavior:"smooth"
    });

}


/* LANGUAGE */

function changeLanguage(){

    const lang=getLanguage();


    if(lang==="te"){

        document.getElementById("title").innerText=
        "📅 రోజుల ఆహార ప్రణాళిక";

        document.getElementById("goalTitle").innerText=
        "🎯 మీ లక్ష్యాన్ని ఎంచుకోండి";

        document.getElementById("lossBtn").innerText=
        "⚖️ బరువు తగ్గడం";

        document.getElementById("gainBtn").innerText=
        "💪 బరువు పెరగడం";

        document.getElementById("healthyBtn").innerText=
        "🥗 ఆరోగ్యకరమైన ఆహారం";

        document.getElementById("daysTitle").innerText=
        "📆 ఎన్ని రోజులు కావాలో ఎంచుకోండి";

        document.getElementById("day1Btn").innerText=
        "1 రోజు";

        document.getElementById("day7Btn").innerText=
        "7 రోజులు";

        document.getElementById("day15Btn").innerText=
        "15 రోజులు";

        document.getElementById("day30Btn").innerText=
        "30 రోజులు";

        document.getElementById("foodTitle").innerText=
        "🍽️ ఆహార రకాన్ని ఎంచుకోండి";

        document.getElementById("vegBtn").innerText=
        "🥦 వెజ్";

        document.getElementById("nonVegBtn").innerText=
        "🍗 నాన్-వెజ్";

        document.getElementById("calorieTitle").innerText=
        "🔥 రోజువారీ క్యాలరీలను ఎంచుకోండి";

        document.getElementById("generateButton").innerText=
        "🍽️ డైట్ ప్లాన్ తయారు చేయండి";

        document.getElementById("backButton").innerText=
        "← వెనక్కి";

        document.getElementById("nextButton").innerText=
        "తర్వాత →";

    }

    else{

        document.getElementById("title").innerText=
        "📅 Days Diet Plan";

        document.getElementById("goalTitle").innerText=
        "🎯 Select Your Goal";

        document.getElementById("lossBtn").innerText=
        "⚖️ Weight Loss";

        document.getElementById("gainBtn").innerText=
        "💪 Weight Gain";

        document.getElementById("healthyBtn").innerText=
        "🥗 Healthy Diet";

        document.getElementById("daysTitle").innerText=
        "📆 Select Number of Days";

        document.getElementById("day1Btn").innerText=
        "1 Day";

        document.getElementById("day7Btn").innerText=
        "7 Days";

        document.getElementById("day15Btn").innerText=
        "15 Days";

        document.getElementById("day30Btn").innerText=
        "30 Days";

        document.getElementById("foodTitle").innerText=
        "🍽️ Select Food Type";

        document.getElementById("vegBtn").innerText=
        "🥦 Veg";

        document.getElementById("nonVegBtn").innerText=
        "🍗 Non-Veg";

        document.getElementById("calorieTitle").innerText=
        "🔥 Select Daily Calories";

        document.getElementById("generateButton").innerText=
        "🍽️ Generate Diet Plan";

        document.getElementById("backButton").innerText=
        "← Back";

        document.getElementById("nextButton").innerText=
        "Next →";

    }


    /*
       If a plan was already generated,
       regenerate it in the selected language.
    */

    if(
        selectedGoal &&
        selectedDays &&
        selectedFood &&
        selectedCalories
    ){

        generatePlan();

    }

}


/* BACK */

function goBack(){

    window.location.href="diet.html";

}


/* NEXT */

function goNext(){

    window.location.href="vitamins-page.html";

}

</script>

</body>

</html>
