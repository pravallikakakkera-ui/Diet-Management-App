<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diet Plan - Diet Management App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dffaf1, #ffffff);
            color: #333;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #159b7d;
            margin-bottom: 25px;
        }

        .language-box {
            text-align: right;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .section {
            margin: 20px 0;
        }

        .options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 12px 22px;
            border: 2px solid #159b7d;
            background: white;
            color: #159b7d;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .option-btn:hover,
        .option-btn.active {
            background: #159b7d;
            color: white;
        }

        .generate-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: #159b7d;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #10745f;
        }

        .result {
            margin-top: 25px;
        }

        .result h2 {
            color: #159b7d;
            text-align: center;
        }

        .day-card {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 18px;
            margin: 15px 0;
            background: #f9fffc;
        }

        .day-card h3 {
            color: #159b7d;
            margin-top: 0;
        }

        .meal {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }

        .calories {
            font-weight: bold;
            color: #159b7d;
        }

        .summary {
            margin-top: 25px;
            padding: 20px;
            background: #e8faf4;
            border-radius: 15px;
            text-align: center;
        }

        .navigation {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 30px;
            background: #159b7d;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
        }

        .nav-btn:hover {
            background: #10745f;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .navigation {
                flex-direction: column;
                align-items: center;
            }

            .nav-btn {
                width: 90%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Language -->
        <div class="language-box">

            <label for="language" id="languageLabel">
                🌐 Language
            </label>

            <select id="language" onchange="changeLanguage()">

                <option value="en">English</option>
                <option value="te">తెలుగు</option>

            </select>

        </div>


        <!-- Page Title -->
        <h1 id="pageTitle">
            🥗 Personalized Diet Plan
        </h1>


        <!-- Goal -->
        <div class="section">

            <label id="goalLabel">
                Choose Your Goal
            </label>

            <div class="options">

                <button
                    class="option-btn"
                    onclick="selectGoal(this, 'Weight Loss')"
                    id="lossBtn">
                    Weight Loss
                </button>

                <button
                    class="option-btn"
                    onclick="selectGoal(this, 'Weight Gain')"
                    id="gainBtn">
                    Weight Gain
                </button>

                <button
                    class="option-btn"
                    onclick="selectGoal(this, 'Healthy Diet')"
                    id="healthyBtn">
                    Healthy Diet
                </button>

            </div>

        </div>


        <!-- Number of Days -->
        <div class="section">

            <label id="daysLabel">
                Number of Days
            </label>

            <select id="days">

                <option value="1" id="day1">1 Day</option>

                <option value="7" id="day7">7 Days</option>

                <option value="15" id="day15">15 Days</option>

                <option value="30" selected id="day30">30 Days</option>

            </select>

        </div>


        <!-- Food Type -->
        <div class="section">

            <label id="foodTypeLabel">
                Food Type
            </label>

            <div class="options">

                <button
                    class="option-btn"
                    onclick="selectFood(this, 'Veg')"
                    id="vegBtn">
                    🥦 Veg
                </button>

                <button
                    class="option-btn"
                    onclick="selectFood(this, 'Non-Veg')"
                    id="nonVegBtn">
                    🍗 Non-Veg
                </button>

            </div>

        </div>


        <!-- Calories -->
        <div class="section">

            <label id="calorieLabel">
                Daily Calorie Target
            </label>

            <select id="calories">

                <option value="1500" id="cal1500">
                    1500 Calories
                </option>

                <option value="1800" id="cal1800">
                    1800 Calories
                </option>

                <option value="2000" selected id="cal2000">
                    2000 Calories
                </option>

                <option value="2200" id="cal2200">
                    2200 Calories
                </option>

                <option value="2500" id="cal2500">
                    2500 Calories
                </option>

            </select>

        </div>


        <!-- Generate Button -->
        <button
            class="generate-btn"
            onclick="generatePlan()"
            id="generateBtn">

            Generate Diet Plan

        </button>


        <!-- Result -->
        <div
            class="result"
            id="result">
        </div>


        <!-- Navigation -->
        <div class="navigation">

            <a
                href="diet.html"
                class="nav-btn"
                id="backButton">

                ← Back

            </a>

            <a
                href="vitamins-page.html"
                class="nav-btn"
                id="nextButton">

                Next →

            </a>

        </div>

    </div>


    <script>

        let selectedGoal = "";
        let selectedFoodType = "";
        let currentLanguage = "en";


        // =========================
        // Select Goal
        // =========================

        function selectGoal(button, goal) {

            document
                .querySelectorAll("#lossBtn, #gainBtn, #healthyBtn")
                .forEach(function(btn) {
                    btn.classList.remove("active");
                });

            button.classList.add("active");

            selectedGoal = goal;
        }


        // =========================
        // Select Food
        // =========================

        function selectFood(button, type) {

            document
                .querySelectorAll("#vegBtn, #nonVegBtn")
                .forEach(function(btn) {
                    btn.classList.remove("active");
                });

            button.classList.add("active");

            selectedFoodType = type;
        }


        // =========================
        // Generate Diet Plan
        // =========================

        function generatePlan() {

            const days =
                parseInt(document.getElementById("days").value);

            const calories =
                document.getElementById("calories").value;


            if (selectedGoal === "") {

                if (currentLanguage === "te") {
                    alert("దయచేసి మీ లక్ష్యాన్ని ఎంచుకోండి.");
                } else {
                    alert("Please select your goal.");
                }

                return;
            }


            if (selectedFoodType === "") {

                if (currentLanguage === "te") {
                    alert("దయచేసి వెజ్ లేదా నాన్-వెజ్ ఎంచుకోండి.");
                } else {
                    alert("Please select Veg or Non-Veg.");
                }

                return;
            }


            // =========================
            // Language Text
            // =========================

            let title;
            let goalText;
            let foodText;
            let calorieText;
            let durationText;
            let morningText;
            let afternoonText;
            let snacksText;
            let nightText;
            let successTitle;
            let successText;
            let nextText;


            if (currentLanguage === "te") {

                title = "🥗 మీ వ్యక్తిగత డైట్ ప్లాన్";

                goalText = "లక్ష్యం";

                foodText = "ఆహారం రకం";

                calorieText = "రోజువారీ లక్ష్యం";

                durationText = "ప్లాన్ వ్యవధి";

                morningText = "ఉదయం / అల్పాహారం";

                afternoonText = "మధ్యాహ్నం / భోజనం";

                snacksText = "స్నాక్స్";

                nightText = "రాత్రి / విందు";

                successTitle =
                    "✅ డైట్ ప్లాన్ విజయవంతంగా రూపొందించబడింది";

                successText =
                    "మీరు ఎంచుకున్న డైట్ ప్లాన్‌ను క్రమం తప్పకుండా పాటించండి మరియు తగినంత నీరు తాగండి.";

                nextText =
                    "మీరు సిద్ధంగా ఉన్నప్పుడు, అన్ని విటమిన్లను చూడటానికి తర్వాత బటన్‌ను క్లిక్ చేయండి.";

            } else {

                title = "🥗 Your Personalized Diet Plan";

                goalText = "Goal";

                foodText = "Food Type";

                calorieText = "Daily Target";

                durationText = "Plan Duration";

                morningText = "Morning / Breakfast";

                afternoonText = "Afternoon / Lunch";

                snacksText = "Snacks";

                nightText = "Night / Dinner";

                successTitle =
                    "✅ Diet Plan Created Successfully";

                successText =
                    "Follow your selected diet plan regularly and stay hydrated.";

                nextText =
                    "When you are ready, click Next → to view all vitamins.";
            }


            // =========================
            // Food Lists
            // =========================

            const vegFoods = [

                {
                    en: "Idli",
                    te: "ఇడ్లీ"
                },

                {
                    en: "Dosa",
                    te: "దోస"
                },

                {
                    en: "Vegetable Upma",
                    te: "కూరగాయల ఉప్మా"
                },

                {
                    en: "Rice & Dal",
                    te: "అన్నం & పప్పు"
                },

                {
                    en: "Leafy Vegetables",
                    te: "ఆకుకూరలు"
                },

                {
                    en: "Vegetables",
                    te: "కూరగాయలు"
                },

                {
                    en: "Curd",
                    te: "పెరుగు"
                },

                {
                    en: "Nuts",
                    te: "డ్రై ఫ్రూట్స్"
                },

                {
                    en: "Banana",
                    te: "అరటిపండు"
                },

                {
                    en: "Milk",
                    te: "పాలు"
                },

                {
                    en: "Roti",
                    te: "రోటీ"
                }

            ];


            const nonVegFoods = [

                {
                    en: "Idli",
                    te: "ఇడ్లీ"
                },

                {
                    en: "Egg",
                    te: "గుడ్డు"
                },

                {
                    en: "Rice & Dal",
                    te: "అన్నం & పప్పు"
                },

                {
                    en: "Chicken",
                    te: "చికెన్"
                },

                {
                    en: "Fish",
                    te: "చేప"
                },

                {
                    en: "Vegetables",
                    te: "కూరగాయలు"
                },

                {
                    en: "Curd",
                    te: "పెరుగు"
                },

                {
                    en: "Nuts",
                    te: "డ్రై ఫ్రూట్స్"
                },

                {
                    en: "Banana",
                    te: "అరటిపండు"
                },

                {
                    en: "Milk",
                    te: "పాలు"
                },

                {
                    en: "Roti",
                    te: "రోటీ"
                }

            ];


            const foods =
                selectedFoodType === "Veg"
                    ? vegFoods
                    : nonVegFoods;


            // =========================
            // Goal Translation
            // =========================

            let displayGoal;

            if (currentLanguage === "te") {

                if (selectedGoal === "Weight Loss") {
                    displayGoal = "బరువు తగ్గడం";
                }

                else if (selectedGoal === "Weight Gain") {
                    displayGoal = "బరువు పెరగడం";
                }

                else {
                    displayGoal = "ఆరోగ్యకరమైన ఆహారం";
                }

            } else {

                displayGoal = selectedGoal;
            }


            // =========================
            // Food Translation
            // =========================

            let displayFood;

            if (currentLanguage === "te") {

                if (selectedFoodType === "Veg") {
                    displayFood = "🥦 వెజ్";
                } else {
                    displayFood = "🍗 నాన్-వెజ్";
                }

            } else {

                displayFood = selectedFoodType;
            }


            // =========================
            // Starting Result
            // =========================

            let result = `

                <h2>
                    ${title}
                </h2>

                <div class="summary">

                    <p>
                        <strong>${goalText}:</strong>
                        ${displayGoal}
                    </p>

                    <p>
                        <strong>${foodText}:</strong>
                        ${displayFood}
                    </p>

                    <p>
                        <strong>${calorieText}:</strong>
                        ${calories}
                        ${currentLanguage === "te" ? "క్యాలరీలు" : "Calories"}
                    </p>

                    <p>
                        <strong>${durationText}:</strong>
                        ${days}
                        ${currentLanguage === "te" ? "రోజులు" : "Days"}
                    </p>

                </div>

            `;


            // =========================
            // Create Daily Plan
            // =========================

            for (
                let day = 1;
                day <= days;
                day++
            ) {

                const breakfast =
                    foods[(day - 1) % foods.length];

                const lunch =
                    foods[(day + 2) % foods.length];

                const snack =
                    foods[(day + 5) % foods.length];

                const dinner =
                    foods[(day + 7) % foods.length];


                const breakfastName =
                    currentLanguage === "te"
                        ? breakfast.te
                        : breakfast.en;

                const lunchName =
                    currentLanguage === "te"
                        ? lunch.te
                        : lunch.en;

                const snackName =
                    currentLanguage === "te"
                        ? snack.te
                        : snack.en;

                const dinnerName =
                    currentLanguage === "te"
                        ? dinner.te
                        : dinner.en;


                const dayText =
                    currentLanguage === "te"
                        ? "రోజు"
                        : "Day";


                result += `

                    <div class="day-card">

                        <h3>
                            ${dayText} ${day}
                        </h3>


                        <div class="meal">

                            🌅
                            <strong>
                                ${morningText}:
                            </strong>

                            ${breakfastName}

                        </div>


                        <div class="meal">

                            ☀️
                            <strong>
                                ${afternoonText}:
                            </strong>

                            ${lunchName}

                        </div>


                        <div class="meal">

                            🍎
                            <strong>
                                ${snacksText}:
                            </strong>

                            ${snackName}

                        </div>


                        <div class="meal">

                            🌙
                            <strong>
                                ${nightText}:
                            </strong>

                            ${dinnerName}

                        </div>


                        <div class="meal calories">

                            🔥
                            ${calorieText}:
                            ${calories}
                            ${currentLanguage === "te" ? "క్యాలరీలు" : "Calories"}

                        </div>

                    </div>

                `;
            }


            // =========================
            // Final Message
            // =========================

            result += `

                <div class="summary">

                    <h3>
                        ${successTitle}
                    </h3>

                    <p>
                        ${successText}
                    </p>

                    <p>
                        ${nextText}
                    </p>

                </div>

            `;


            document.getElementById("result").innerHTML =
                result;


            window.scrollTo({

                top: document.body.scrollHeight,

                behavior: "smooth"

            });

        }


        // =========================
        // Language Change
        // =========================

        function changeLanguage() {

            currentLanguage =
                document.getElementById("language").value;


            if (currentLanguage === "te") {

                document.getElementById("pageTitle").innerText =
                    "🥗 వ్యక్తిగత డైట్ ప్లాన్";


                document.getElementById("languageLabel").innerText =
                    "🌐 భాష";


                document.getElementById("goalLabel").innerText =
                    "మీ లక్ష్యాన్ని ఎంచుకోండి";


                document.getElementById("lossBtn").innerText =
                    "బరువు తగ్గడం";


                document.getElementById("gainBtn").innerText =
                    "బరువు పెరగడం";


                document.getElementById("healthyBtn").innerText =
                    "ఆరోగ్యకరమైన ఆహారం";


                document.getElementById("daysLabel").innerText =
                    "ఎన్ని రోజులు";


                document.getElementById("day1").innerText =
                    "1 రోజు";


                document.getElementById("day7").innerText =
                    "7 రోజులు";


                document.getElementById("day15").innerText =
                    "15 రోజులు";


                document.getElementById("day30").innerText =
                    "30 రోజులు";


                document.getElementById("foodTypeLabel").innerText =
                    "ఆహారం రకం";


                document.getElementById("vegBtn").innerText =
                    "🥦 వెజ్";


                document.getElementById("nonVegBtn").innerText =
                    "🍗 నాన్-వెజ్";


                document.getElementById("calorieLabel").innerText =
                    "రోజువారీ క్యాలరీ లక్ష్యం";


                document.getElementById("cal1500").innerText =
                    "1500 క్యాలరీలు";


                document.getElementById("cal1800").innerText =
                    "1800 క్యాలరీలు";


                document.getElementById("cal2000").innerText =
                    "2000 క్యాలరీలు";


                document.getElementById("cal2200").innerText =
                    "2200 క్యాలరీలు";


                document.getElementById("cal2500").innerText =
                    "2500 క్యాలరీలు";


                document.getElementById("generateBtn").innerText =
                    "డైట్ ప్లాన్ రూపొందించండి";


                document.getElementById("backButton").innerText =
                    "← వెనుకకు";


                document.getElementById("nextButton").innerText =
                    "తర్వాత →";

            }


            else {

                document.getElementById("pageTitle").innerText =
                    "🥗 Personalized Diet Plan";


                document.getElementById("languageLabel").innerText =
                    "🌐 Language";


                document.getElementById("goalLabel").innerText =
                    "Choose Your Goal";


                document.getElementById("lossBtn").innerText =
                    "Weight Loss";


                document.getElementById("gainBtn").innerText =
                    "Weight Gain";


                document.getElementById("healthyBtn").innerText =
                    "Healthy Diet";


                document.getElementById("daysLabel").innerText =
                    "Number of Days";


                document.getElementById("day1").innerText =
                    "1 Day";


                document.getElementById("day7").innerText =
                    "7 Days";


                document.getElementById("day15").innerText =
                    "15 Days";


                document.getElementById("day30").innerText =
                    "30 Days";


                document.getElementById("foodTypeLabel").innerText =
                    "Food Type";


                document.getElementById("vegBtn").innerText =
                    "🥦 Veg";


                document.getElementById("nonVegBtn").innerText =
                    "🍗 Non-Veg";


                document.getElementById("calorieLabel").innerText =
                    "Daily Calorie Target";


                document.getElementById("cal1500").innerText =
                    "1500 Calories";


                document.getElementById("cal1800").innerText =
                    "1800 Calories";


                document.getElementById("cal2000").innerText =
                    "2000 Calories";


                document.getElementById("cal2200").innerText =
                    "2200 Calories";


                document.getElementById("cal2500").innerText =
                    "2500 Calories";


                document.getElementById("generateBtn").innerText =
                    "Generate Diet Plan";


                document.getElementById("backButton").innerText =
                    "← Back";


                document.getElementById("nextButton").innerText =
                    "Next →";

            }


            // If a plan is already generated,
            // generate it again in selected language.

            if (selectedGoal !== "" && selectedFoodType !== "") {

                generatePlan();

            }

        }

    </script>

</body>

</html>
